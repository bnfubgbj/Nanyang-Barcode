name: Build NanyangBarcode.exe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install openpyxl pdfplumber pyinstaller

    - name: Build .exe
      run: |
        pyinstaller --onefile --windowed --name "NanyangBarcode" nanyang_barcode.py

    - name: Upload .exe as artifact
      uses: actions/upload-artifact@v4
      with:
        name: NanyangBarcode
        path: dist/NanyangBarcode.exe
        retention-days: 30
